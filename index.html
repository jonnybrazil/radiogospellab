<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="GOSPELLAB — programação, mensagem do dia e avisos da Rádio Gospel Lab.">
  <title>GOSPELLAB — Rádio Gospel Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css?v=20260929-12">
  <link rel="icon" href="favicon.jpg?v=20260924" type="image/jpeg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20260924">
</head>
<body>
  <main class="page-shell">
    <header class="site-header">
      <h1>GOSPELLAB</h1>
      <p>Apresentado por IBLUZ</p>
    </header>

    <section class="section programming" aria-labelledby="programming-title">
      <h2 id="programming-title" class="visually-hidden">Programação</h2>
      <div class="hero-player">
        <div class="hero-meta">
          <div class="live-status"><span id="live-dot" class="live-dot"></span><span id="live-label">AO VIVO</span></div>
          <div class="hero-audience audience" title="Visitas totais"><svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.2 12s3.5-5 9.8-5 9.8 5 9.8 5-3.5 5-9.8 5-9.8-5-9.8-5Z"></path><circle cx="12" cy="12" r="2.4"></circle></svg> <span id="view-counter">—</span></div>
        </div>
        <button id="radio-toggle" class="radio-toggle" type="button" aria-pressed="false" aria-label="Iniciar">
          <span id="radio-icon" class="radio-icon" aria-hidden="true"><svg class="play-glyph" viewBox="0 0 70 80" aria-hidden="true"><path d="M8 5 C5 3 2 5 2 9 V71 C2 75 5 77 8 75 L64 44 C68 42 68 38 64 36 Z"></path></svg></span>
          <strong id="current-title">Iniciar</strong>
        </button>
      </div>
    </section>

    <nav class="quick-nav" aria-label="Navegação da rádio">
      <button type="button" data-panel="message-content" aria-expanded="false">Mensagem do Dia</button>
      <button type="button" data-panel="notices-content" aria-expanded="false">Notícias</button>
      <button type="button" data-panel="sponsors-content" aria-expanded="false">Patrocínios</button>
      <button type="button" data-panel="contact-content" aria-expanded="false">Contato</button>
    </nav>

    <section class="section" aria-label="Mensagem do Dia">
      <div id="message-content" class="expandable-content is-collapsed"><p>Carregando mensagem...</p></div>
    </section>

    <section class="section" aria-label="Avisos">
      <div id="notices-content" class="notice-box expandable-content is-collapsed"><p>Carregando avisos...</p></div>
    </section>

    <section class="section" aria-label="Patrocínios">
      <div id="sponsors-content" class="expandable-content sponsors is-collapsed"><div id="sponsors-grid" class="sponsors-grid"><p>Carregando patrocinadores...</p></div></div>
    </section>

    <section class="section contact-section" aria-label="Contato">
      <div id="contact-content" class="expandable-content is-collapsed">
        <form id="guestbook-form" class="guestbook-form">
          <div class="guestbook-fields">
            <label>Nome<input name="name" type="text" maxlength="80" autocomplete="name" required></label>
            <label>Cidade<input name="city" type="text" maxlength="80" autocomplete="address-level2" required></label>
            <label>Estado<select name="state" autocomplete="address-level1" required><option value="">Selecione</option><option>AC</option><option>AL</option><option>AP</option><option>AM</option><option>BA</option><option>CE</option><option>DF</option><option>ES</option><option>GO</option><option>MA</option><option>MT</option><option>MS</option><option>MG</option><option>PA</option><option>PB</option><option>PR</option><option>PE</option><option>PI</option><option>RJ</option><option>RN</option><option>RS</option><option>RO</option><option>RR</option><option>SC</option><option>SP</option><option>SE</option><option>TO</option></select></label>
          </div>
          <label>Mensagem<textarea name="message" rows="5" maxlength="500" required></textarea></label>
          <input class="guestbook-trap" name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
          <button type="submit">Enviar mensagem</button>
          <p id="guestbook-status" class="guestbook-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>

    <footer>
      <p>Copyright @ 2026 Radio Gospel Lab</p>
      <p>Hospedado no GitHub Pages</p>
    </footer>
  </main>

  <audio id="audio-a" preload="metadata"></audio>
  <audio id="audio-b" preload="metadata"></audio>
  <script src="app.js?v=20260930-1" defer></script>
</body>
</html>
