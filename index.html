<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="GOSPELLAB — programação, mensagem do dia e avisos da Rádio Gospel Lab.">
  <title>GOSPELLAB — Rádio Gospel Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="favicon.jpg?v=20260924" type="image/jpeg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20260924">
</head>
<body>
  <main class="page-shell">
    <header class="site-header">
      <h1>GOSPELLAB</h1>
      <p>Apresentando: Igreja Batista Luz</p>
    </header>

    <section class="section programming" aria-labelledby="programming-title">
      <div class="section-heading">
        <h2 id="programming-title">Programação</h2>
        <span class="audience" title="Visitas totais"><svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.2 12s3.5-5 9.8-5 9.8 5 9.8 5-3.5 5-9.8 5-9.8-5-9.8-5Z"></path><circle cx="12" cy="12" r="2.4"></circle></svg> <span id="view-counter">—</span></span>
      </div>

      <div class="live-status"><span id="live-dot" class="live-dot"></span><span id="live-label">AO VIVO</span></div>
      <button id="radio-toggle" class="radio-toggle" type="button" aria-pressed="false" aria-label="Iniciar">
        <span id="radio-icon" class="radio-icon" aria-hidden="true"><span class="play-glyph"></span></span>
        <strong id="current-title">Iniciar</strong>
      </button>
    </section>

    <section class="section" aria-labelledby="message-title">
      <div class="section-heading"><h2 id="message-title">Mensagem do Dia</h2></div>
      <div id="message-content" class="expandable-content is-collapsed"><p>Carregando mensagem...</p></div>
      <button class="more-button" id="message-toggle" type="button">Ver mais</button>
    </section>

    <section class="section" aria-labelledby="notices-title">
      <div class="section-heading"><h2 id="notices-title">Avisos</h2></div>
      <div id="notices-content" class="notice-box"><p>Carregando avisos...</p></div>
    </section>

    <section class="section" aria-labelledby="sponsors-title">
      <div class="section-heading"><h2 id="sponsors-title">Patrocínios</h2></div>
      <div id="sponsors-content" class="expandable-content sponsors is-collapsed"><div id="sponsors-grid" class="sponsors-grid"><p>Carregando patrocinadores...</p></div></div>
      <button class="more-button" id="sponsors-toggle" type="button">Ver mais</button>
    </section>

    <footer>
      <p>Copyright © <span id="current-year">2026</span> Rádio Gospel Lab</p>
      <p>Hospedado no GitHub Pages</p>
    </footer>
  </main>

  <audio id="audio-a" preload="metadata"></audio>
  <audio id="audio-b" preload="metadata"></audio>
  <script src="app.js?v=20260925-2" defer></script>
</body>
</html>
